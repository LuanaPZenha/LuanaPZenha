name: Atualiza cards do GitHub

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixa cards de estatísticas
        run: |
          mkdir -p assets
          curl -fsSL "https://denvercoder1-github-readme-stats.vercel.app/api?username=LuanaPZenha&show_icons=true&theme=tokyonight&hide_border=true" -o assets/github-stats.svg
          curl -fsSL "https://denvercoder1-github-readme-stats.vercel.app/api/top-langs/?username=LuanaPZenha&layout=compact&theme=tokyonight&hide_border=true" -o assets/github-langs.svg

      - name: Publica se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-langs.svg
          if git diff --cached --quiet; then
            echo "Cards sem alteração"
          else
            git commit -m "chore: atualiza cards de estatísticas do GitHub"
            git push
          fi
